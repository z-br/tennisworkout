<circle cx="28" cy="330" r="12" fill="#2f9e6f"/>
<text x="28" y="334" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">6</text>
<text x="48" y="327" fill="#16241c" font-size="13.5" font-weight="700">Shuffles + split steps + 2 sprints</text>
<text x="48" y="343" fill="#5d6b62" font-size="11">Move in your playing planes</text>
