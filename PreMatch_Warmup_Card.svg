<text x="48" y="129" fill="#16241c" font-size="13.5" font-weight="700">Leg swings</text>
<text x="48" y="145" fill="#5d6b62" font-size="11">Front-back ×10 + lateral ×10 each</text>
<rect x="318" y="119" width="46" height="21" rx="10.5" fill="#eaf6f0"/>
<text x="341" y="133" fill="#247a55" font-size="11.5" font-weight="700" text-anchor="middle">45s</text>
