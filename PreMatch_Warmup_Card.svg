<text x="28" y="182" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">3</text>
<text x="48" y="175" fill="#16241c" font-size="13.5" font-weight="700">Walking lunge + reach/rotate</text>
<text x="48" y="191" fill="#5d6b62" font-size="11">4–5 each side, twist over front leg</text>
<rect x="318" y="165" width="46" height="21" rx="10.5" fill="#eaf6f0"/>
<text x="341" y="179" fill="#247a55" font-size="11.5" font-weight="700" text-anchor="middle">45s</text>
