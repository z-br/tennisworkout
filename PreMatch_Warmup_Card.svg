<text x="46" y="30" fill="#ffffff" font-size="19" font-weight="700">Pre-Match Warm-Up</text>
<text x="46" y="48" fill="#ffffff" font-size="10.5" letter-spacing="1" opacity="0.92">~5 MIN · ON COURT BEFORE PLAY</text>
