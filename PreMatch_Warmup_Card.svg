<rect x="318" y="363" width="46" height="21" rx="10.5" fill="#eaf6f0"/>
<text x="341" y="377" fill="#247a55" font-size="11.5" font-weight="700" text-anchor="middle">60s</text>
<rect x="14" y="410" width="352" height="62" rx="9" fill="#f4faf6" stroke="#e3ebe5"/>
<rect x="14" y="410" width="4" height="62" rx="2" fill="#2f9e6f"/>
<text x="28" y="432" font-size="12" fill="#16241c"><tspan font-weight="700" fill="#247a55">Then warm-up hit:</tspan> build swing pace gradually —</text>
<text x="28" y="450" font-size="12" fill="#16241c"><tspan font-weight="700">never first-ball-full-pace.</tspan> Your #1 elbow</text>
<text x="28" y="466" font-size="12" fill="#16241c">protector.</text>
